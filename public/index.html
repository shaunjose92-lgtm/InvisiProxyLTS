 try{sessionStorage.removeItem("cbsr")}catch{}
}catch(e){ready=null;showErr({title:"Cipher Browser"},"Engine error: "+(e&&e.message||e),()=>location.reload());throw e}})()}
/* ---- tabs ---- */
const bmOf=u=>bms.find(b=>b.url===u);
function draw(){const t=tabs[cur];$("start").classList.toggle("on",!t||!t.url);$("tabs").innerHTML="";
 tabs.forEach((x,i)=>{const d=document.createElement("div");d.className="tab"+(i==cur?" on":"")+(x.shown?"":" in")+(x.closing?" out":"");x.shown=true;const s=document.createElement("span");s.textContent=x.title||"New tab";const c=document.createElement("b");c.textContent="×";c.title="Close tab";c.onclick=e=>{e.stopPropagation();closeTab(i)};d.append(s,c);d.onclick=()=>activate(i);$("tabs").append(d);x.f.classList.toggle("on",i==cur)});
 const p=document.createElement("div");p.className="tab add";p.textContent="+";p.title="New tab";p.onclick=()=>openTab("");$("tabs").append(p);
 if(document.activeElement!==$("url"))$("url").value=t?t.url:"";{const on=!!(t&&t.url&&bmOf(t.url));$("bm").textContent=on?"★":"☆";$("bm").classList.toggle("on",on)}}
const save=()=>api("tabs",{method:"PUT",body:JSON.stringify({tabs:tabs.filter(t=>t.url).map(t=>({url:t.url,title:t.title}))})}).catch(()=>{});
function activate(i){cur=i;const t=tabs[i];if(t&&t.pend){const u=t.pend;t.pend=null;go(t,u,1)}draw()}
function closeTab(i){const x=tabs[i];if(!x||x.closing)return;x.closing=1;const el=$("tabs").children[i];if(el)el.classList.add("out");
 setTimeout(()=>{const k=tabs.indexOf(x);if(k<0)return;x.f.remove();tabs.splice(k,1);if(L.t&&!tabs.includes(L.t))hideLd();if(!tabs.length){openTab("");return}cur=Math.min(cur>k?cur-1:cur,tabs.length-1);activate(cur);save()},170)}

/* ---- per-frame plugins: URL watcher, cache, ad/tracker blocking, Cipher error page ---- */
const ADS=/(^|\.)(doubleclick\.net|googlesyndication\.com|googleadservices\.com|adsafeprotected\.com|sharethrough\.com|adnxs\.com|pubmatic\.com|rubiconproject\.com|criteo\.(com|net)|3lift\.com|amazon-adsystem\.com|moatads\.com|doubleverify\.com|adform\.net|openx\.net|casalemedia\.com|taboola\.com|outbrain\.com|google-analytics\.com|scorecardresearch\.com|yieldmo\.com|smaato\.net|media\.net|indexww\.com|contextweb\.com|bidswitch\.net|adsrvr\.org|teads\.tv|ads\.pubmatic\.com)$/i;
const ADBLOCK=false; /* set true to block ad/tracker hosts (can break some game sites) */
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const errPage=(url,err)=>`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cipher Browser</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:wght@700&display=swap');:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;background:#f4f1e9;color:#2b2620;font:15px Inter,system-ui,sans-serif}@media(prefers-color-scheme:dark){body{background:#2a2620;color:#ede5d4}}.b{width:72px;height:72px;margin:0 auto 20px;border-radius:22px;background:rgba(192,80,77,.14);color:#c0504d;display:grid;place-items:center;font:700 32px Georgia,serif}h1{font:700 32px/1.15 'Source Serif 4',Georgia,serif;letter-spacing:-.035em;margin:0 0 10px}h1 em{color:#7a8a62}p{opacity:.7;max-width:480px;margin:0 auto 14px;line-height:1.6}code{display:block;max-width:520px;margin:0 auto;padding:12px 16px;border-radius:14px;background:rgba(122,138,98,.14);font:12px ui-monospace,monospace;word-break:break-word;text-align:left}</style><div><div class="b">!</div><h1>We couldn’t load <em>this page</em></h1><p>Something got in the way. Here’s what the Cipher server told us.</p><code>${esc(url)}<br>${esc(err)}</code></div>`;
function mkPlugins(t){const pl=[];
 try{pl.push(new $scramjetUtils.UrlWatcherPlugin(x=>{const h=String(x);if(t.armed&&h&&h!==t.url){t.url=h;$("pbar").style.width="70%";draw();save()}}))}catch(e){console.warn("UrlWatcher",e)}
 try{const {ManagedPlugin}=$scramjetController;
  class CipherPlugin extends ManagedPlugin{constructor(){super("cipher-plugin",[])}
   install(frame){super.install(frame);
    const blank={body:"",status:204,statusText:"No Content"};
    this.tap(frame.hooks.fetch.request,(ctx,props)=>{try{const h=(props.url&&props.url.hostname)||new URL(props.url).hostname;if(ADBLOCK&&ADS.test(h))props.earlyResponse={...blank,headers:[]}}catch{}});
    this.tap(frame.hooks.error.request,(ctx,props)=>{props.suppressError=true;
     props.setResponse={status:502,statusText:"Bad Gateway",headers:[["Content-Type","text/html; charset=utf-8"]],body:errPage((ctx.rawrequest&&ctx.rawrequest.rawUrl)||"",String(ctx.error))}})}}
  pl.push(new CipherPlugin())}catch(e){console.warn("CipherPlugin",e)}
 return pl}
async function openTab(u,title,lazy){try{await boot()}catch{return}
 const fe=document.createElement("iframe");fe.setAttribute("allow","fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; accelerometer; gyroscope; microphone; camera; midi; encrypted-media; picture-in-picture; web-share");
 const t={f:fe,url:"",title:title||"",q:null,ei:0,armed:false,pend:null};
 fe.addEventListener("load",()=>onLoad(t));$("frames").append(fe);
 const pl=mkPlugins(t);
 t.fr=ctl.createFrame(fe,{plugins:pl});tabs.push(t);cur=tabs.length-1;
 if(lazy){t.url=u;t.pend=u}else if(u)go(t,u);draw();return t}
function onLoad(t){if(!t.armed)return;let bad=null;
 try{const w=t.f.contentWindow;if(w.location.href==="about:blank")return;const d=t.f.contentDocument,x=((d.body&&d.body.innerText)||"").trim();
  if(d.title)t.title=d.title;if(x.length<1500&&/Service Worker Error|Request failed with error code|Internal Service/i.test(x))bad=x}catch{}
 $("pbar").style.width="100%";setTimeout(()=>$("pbar").style.width="0",400);
 if(bad){fail(t,bad);return}
 t.err=null;if(L.t===t)hideLd();draw();save()}
function go(t,u,silent){t.url=u;t.title=host(u);t.armed=true;t.err=null;L.err=null;$("pbar").style.width="70%";if(!silent||L.t!==t)showLoad(t);else $("ldT").textContent=short(t.title);
 t.d0=null;try{t.d0=t.f.contentDocument}catch{}
 t.fr.go(u);api("data/history",J({url:u,title:t.title}));draw();save()}
function nav(v){const t=tabs[cur];const raw=v.trim();if(!raw)return;let u;
 if(/^https?:\/\//i.test(raw)){u=raw;t.q=null}else if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(raw)){u="https://"+raw;t.q=null}else{t.q=raw;t.ei=0;api("data/searches",J({query:raw}));u=ENG[0]+encodeURIComponent(raw)}
 go(t,u)}
const submit=v=>{if(!v.trim())return;if(!tabs.length)openTab("").then(()=>nav(v));else nav(v)};
/* ---- controls ---- */
document.querySelectorAll(".tile").forEach(x=>x.onclick=()=>submit(x.dataset.u));

$("url").onkeydown=e=>{if(e.key=="Enter")submit(e.target.value)};$("url").onfocus=e=>e.target.select();
$("back").onclick=()=>{try{tabs[cur].f.contentWindow.history.back()}catch{}};

 if(b)await api("data/bookmarks?id="+b.id,{method:"DELETE"});else await api("data/bookmarks",J({url:t.url,title:t.title}));
 await loadBms();draw();{const e=$("bm");e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}st(b?"Bookmark removed":"Bookmarked")};
async function loadBms(){try{bms=await(await api("data/bookmarks")).json();if(!Array.isArray(bms))bms=[]}catch{bms=[]}}
async function panel(k){const s=$("side");if(s.classList.contains("on")&&s.dataset.k==k){s.classList.remove("on");return}
 s.dataset.k=k;s.innerHTML="";const h=document.createElement("h3");h.textContent=k=="history"?"History":"Bookmarks";s.append(h);
 const sk=document.createElement("div");for(let n=0;n<4;n++){const r=document.createElement("div");r.className="row sk";r.innerHTML="<i></i>";sk.append(r)}s.append(sk);s.classList.add("on");
 let r=[];try{r=await(await api("data/"+k)).json()}catch{}if(!Array.isArray(r))r=[];
 if(s.dataset.k!==k||!s.classList.contains("on"))return;sk.remove();
 const empty=()=>{const e=document.createElement("div");e.className="row";e.textContent="Nothing here yet.";s.append(e)};
 if(k=="history"&&r.length){const c=document.createElement("button");c.textContent="Clear all";c.onclick=async()=>{await api("data/history",{method:"DELETE"});c.remove();s.querySelectorAll(".row").forEach(x=>{x.classList.add("gone");setTimeout(()=>x.remove(),180)});setTimeout(empty,200)};h.append(c)}
 r.forEach((x,n)=>{const d=document.createElement("div");d.className="row";d.style.animationDelay=Math.min(n,12)*28+"ms";const a=document.createElement("span");a.textContent=x.title||x.url;a.title=x.url;a.onclick=()=>{s.classList.remove("on");submit(x.url)};
  const z=document.createElement("button");z.textContent="×";z.title="Remove";z.onclick=async()=>{await api("data/"+k+"?id="+x.id,{method:"DELETE"});if(k=="bookmarks"){await loadBms();draw()}d.classList.add("gone");setTimeout(()=>d.remove(),180)};d.append(a,z);s.append(d)});
 if(!r.length)empty()}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#side,#hist,#bks"))$("side").classList.remove("on")});
